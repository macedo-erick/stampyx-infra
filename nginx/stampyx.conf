# A site file is included inside the http block, so this map is legal here. Defining it
# here rather than in nginx.conf keeps the WebSocket support with the only stack that needs
# it — no other product on this box uses one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name stampyx.com www.stampyx.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://stampyx.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.stampyx.com;

    ssl_certificate     /etc/letsencrypt/live/stampyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stampyx.com/privkey.pem;

    return 301 https://stampyx.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stampyx.com;

    ssl_certificate     /etc/letsencrypt/live/stampyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stampyx.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Attachments are capped at 25MB by the API; leave headroom for MIME overhead.
    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:8094;
        include /etc/nginx/snippets/stampyx-proxy.conf;
    }

    location /ui/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/snippets/stampyx-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        include /etc/nginx/snippets/stampyx-proxy.conf;

        # The realtime inbox is a WebSocket. Without these it silently degrades to
        # long-polling, which works but doubles the request rate for no reason.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Host is pinned to $server_name here, not $host: that is what makes Keycloak emit
    # stampyx.com as the issuer. It is a security control, not a formatting detail.
    location /auth/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    # Keeps the admin console and the Admin REST API off the product domain.
    location /auth/admin/ { return 404; }

    # The provisioning callback, reachable only from the auth stack's subnet.
    location /internal/keycloak/ {
        allow 172.21.0.0/16;
        deny  all;
        proxy_pass http://127.0.0.1:8091;
        include /etc/nginx/snippets/stampyx-proxy.conf;
    }

    # The mail plane calls these over the Docker network; they have no business being public.
    location /internal/mail/ { return 404; }

    location /metrics { return 404; }
    location /health  { return 404; }
}
