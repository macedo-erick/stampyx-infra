name: release

on:
  push:
    branches: [master]
    paths:
      - 'mail/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  # Called by deploy.yml when the mail box is ticked. A reusable workflow runs at the
  # caller's ref, so github.sha below is the commit being deployed — the images and the
  # mail/ configs the deploy ships to the VPS come from the same commit by construction.
  workflow_call:

permissions:
  contents: read

env:
  REGION: southamerica-east1
  REPOSITORY: stampyx

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [postfix, dovecot, rspamd]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: mail/docker
          file: mail/docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  summary:
    needs: build-push
    if: success()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy with MAIL_TAG=${{ github.sha }}" >> $GITHUB_STEP_SUMMARY