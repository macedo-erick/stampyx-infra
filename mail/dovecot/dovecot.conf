# Managed by stampyx-infra. Users come from v_dovecot_users: an unverified domain or suspended
# account simply stops resolving, with no regeneration and no restart.

protocols = imap lmtp sieve
listen = *

# No syslog daemon in the container: the default destination discards every line, auth failures included.
log_path = /dev/stderr

mail_location = maildir:/data/vmail/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000

ssl = yes
ssl_cert = </etc/letsencrypt/live/mail.stampyx.com/fullchain.pem
ssl_key  = </etc/letsencrypt/live/mail.stampyx.com/privkey.pem
ssl_min_protocol = TLSv1.2

# Without this Dovecot creates only INBOX and the panel shows one folder until a client makes
# the rest. `separator` is IMAP-visible only: Maildir++ still stores .Sent on disk.
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }

  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }

  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }

  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }

  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

auth_mechanisms = plain login

# Lets the API open any mailbox as `user*stampyx-api`; the separator must match ImapClient.
auth_master_user_separator = *

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/data/vmail/%d/%n
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
  result_success = continue-ok
}

service auth {
  inet_listener {
    port = 12345
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  # Provides vnd.dovecot.pipe; without it the script fails to compile and delivery falls back to INBOX.
  sieve_plugins = sieve_extprograms
  sieve_extensions = copy fileinto imap4flags mailbox vnd.dovecot.pipe envelope encoded-character
  sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe

  sieve = /data/sieve/%d/%n.sieve
  sieve_dir = /data/sieve/%d
}
