# Managed by stampyx-infra. Users come from v_dovecot_users, so an unverified domain or a
# suspended account simply stops resolving here — no config regeneration, no restart.

protocols = imap lmtp sieve
listen = *

# There is no syslog daemon in the container, so the default destination silently discards
# every line, including authentication failures.
log_path = /dev/stderr

mail_location = maildir:/data/vmail/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000

ssl = yes
ssl_cert = </etc/letsencrypt/live/mail.stampyx.com/fullchain.pem
ssl_key  = </etc/letsencrypt/live/mail.stampyx.com/privkey.pem
ssl_min_protocol = TLSv1.2

# Without this block Dovecot creates only INBOX, so Sent, Drafts, Junk and Trash never
# exist until some client happens to make them - which is why the panel showed one folder.
# `separator` is the IMAP-visible one: Maildir++ still stores these as .Sent on disk, but
# clients (and the API) address hierarchy with / instead of the Maildir default dot.
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }

  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }

  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }

  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }

  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

auth_mechanisms = plain login

# Lets the API open any mailbox as `user*stampyx-api` without holding that mailbox's own
# password. The separator has to match what the API builds in ImapClient.
auth_master_user_separator = *

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/data/vmail/%d/%n
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
  result_success = continue-ok
}

service auth {
  inet_listener {
    port = 12345
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  # sieve_extprograms is what provides vnd.dovecot.pipe. Without it the generated script
  # fails to compile and Dovecot silently falls back to plain INBOX delivery.
  sieve_plugins = sieve_extprograms
  sieve_extensions = copy fileinto imap4flags vnd.dovecot.pipe envelope encoded-character
  sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe

  sieve = /data/sieve/%d/%n.sieve
  sieve_dir = /data/sieve/%d
}
